<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StGermain Vacances</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="travel_recommendation.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <img src="saintgermainvacances.jpg" alt="StGermain Vacances logo" class="logo-img">
      <span>StGermain Vacances</span>
    </div>

    <div class="nav-links">
      <a href="travel_recommendation.html">Home</a>
      <a href="about_us.html">About Us</a>
      <a href="contact_us.html">Contact Us</a>
    </div>

    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Enter a destination or keyword">
      <button id="btnSearch">Search</button>
      <button id="btnClear">Clear</button>
    </div>
  </nav>

  <main class="hero">
    <div class="social-icons">
      <a href="#" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
      <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
    </div>

    <div class="hero-content">
      <h1>Explore Dream Destinations</h1>
      <p>
        StGermain Vacances helps you discover the most beautiful places in the world.
        Search for beaches, temples or countries, and get instant travel recommendations
        with photos and descriptions to inspire your next trip.
      </p>
      <a href="contact_us.html" class="btn-book">Book Now</a>
    </div>

    <div id="results" class="results"></div>

  <script src="./travel_recommendation.js"></script>
